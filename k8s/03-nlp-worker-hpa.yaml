apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: layer3-indicner-hpa
  namespace: threat-intel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: layer3-indicner-worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
